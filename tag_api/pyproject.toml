[project]
name = "lr-tag-api"
version = "0.1.0"
description = "Standalone FastAPI that serves pre-computed segment recommendation tags from DuckDB."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.uv]
native-tls = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "D"]
ignore = ["D100", "D104", "ANN401", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.13"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = [
    "config.py",
    "dependencies.py",
    "exceptions.py",
    "main.py",
    "models.py",
    "routes.py",
    "store.py",
]

[tool.coverage.run]
omit = ["tests/*"]
